<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="./main.ts"></script>
</head>
<body>
  <div class="pt-popup">
    <header class="pt-hdr">
      <div class="pt-logo">P</div>
      <div>
        <div class="pt-hdr-name">Parallel-Translation</div>
        <div class="pt-hdr-sub">Bilingual Reader</div>
      </div>
    </header>

    <main class="pt-content">
      <!-- 状态卡 -->
      <div class="pt-card">
        <div class="pt-card-label">状态</div>
        <div class="pt-option-row">
          <span class="pt-option-label">总开关</span>
          <button class="pt-toggle pt-on" id="pt-toggle-master"></button>
        </div>
        <div class="pt-option-row">
          <span class="pt-option-label">翻译本页</span>
          <button class="pt-action-btn" id="pt-translate-page-btn">翻译</button>
        </div>
      </div>

      <!-- 引擎选择 -->
      <div class="pt-card">
        <div class="pt-card-label">翻译引擎</div>
        <div class="pt-option-row">
          <select class="pt-select" id="pt-engine-select"></select>
        </div>
      </div>

      <!-- 语言对 -->
      <div class="pt-card">
        <div class="pt-card-label">语言设置</div>
        <div class="pt-option-row">
          <span class="pt-option-label">源语言</span>
          <select class="pt-select" id="pt-from-select"></select>
        </div>
        <div class="pt-option-row">
          <span class="pt-option-label">目标语言</span>
          <select class="pt-select" id="pt-to-select"></select>
        </div>
      </div>

      <!-- 显示模式 -->
      <div class="pt-card">
        <div class="pt-card-label">显示模式</div>
        <div class="pt-option-row">
          <select class="pt-select" id="pt-mode-select">
            <option value="bilingual">对照</option>
            <option value="translation-only">仅译文</option>
          </select>
        </div>
      </div>
    </main>

    <div id="pt-hint" class="pt-hint" style="display:none"></div>

    <footer class="pt-footer">
      <span>v0.3.0</span>
      <button class="pt-settings-btn" id="pt-settings-btn">设置</button>
    </footer>
  </div>
</body>
</html>
