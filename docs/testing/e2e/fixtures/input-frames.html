<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Input — Text Boxes in Frames</title>
  <style>
    textarea { display: block; width: 360px; height: 80px; margin: 16px 0; font: 16px/1.4 sans-serif; }
    iframe { display: block; width: 420px; height: 140px; margin: 16px 0; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Write a reply</h1>
  <textarea id="reply"></textarea>
  <!-- 同域 iframe：同一个主机名 -->
  <iframe id="same" src="input-frame-child.html"></iframe>
  <!-- 跨域 iframe：顶层页面是 localhost，这里用 127.0.0.1，主机名不同（#672） -->
  <iframe id="cross" src="http://127.0.0.1:4173/input-frame-child.html"></iframe>
</body>
</html>
