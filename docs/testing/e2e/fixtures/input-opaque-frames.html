<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frames With an Opaque Origin</title>
  <style>
    body { font: 16px/1.5 sans-serif; margin: 16px; }
    iframe { display: block; width: 460px; height: 150px; margin: 12px 0; border: 1px solid #888; }
  </style>
</head>
<body>
  <!-- #849：只开 matchAboutBlank 时仍不注入的三种 frame。网页邮箱的邮件正文、
       文件预览常放在这样的 frame 里：sandbox 的 srcdoc（不同源、opaque origin）、
       data: 网址、blob: 网址。打开 matchOriginAsFallback 之后按父页面的网址匹配，
       三种都注入。每个 frame 里一段正文、一个文本框。 -->
  <h1 id="title">Message preview</h1>
  <p id="intro">The message body below is rendered in an isolated frame.</p>
  <iframe id="sandboxed" title="Sandboxed srcdoc" sandbox="allow-scripts"></iframe>
  <iframe id="data" title="data URL"></iframe>
  <iframe id="blob" title="blob URL"></iframe>
  <script>
    const doc = (name) =>
      '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +
      '<style>body{font:16px/1.5 sans-serif;margin:8px}</style></head><body>' +
      '<p id="para">This message body lives in a ' + name + ' frame and is translated with the page.</p>' +
      '<textarea id="child" rows="2" cols="40"></textarea></body></html>';
    document.getElementById('sandboxed').srcdoc = doc('sandboxed srcdoc');
    document.getElementById('data').src = 'data:text/html;charset=utf-8,' + encodeURIComponent(doc('data URL'));
    document.getElementById('blob').src = URL.createObjectURL(new Blob([doc('blob URL')], { type: 'text/html' }));
  </script>
</body>
</html>
