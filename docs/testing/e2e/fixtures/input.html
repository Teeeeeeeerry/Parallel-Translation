<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Input — Text Boxes</title>
  <style>
    textarea { display: block; width: 360px; height: 120px; margin: 16px 0; font: 16px/1.4 sans-serif; }
    input { display: block; width: 360px; margin: 16px 0; font: 16px/1.4 sans-serif; }
  </style>
</head>
<body>
  <h1>Write a reply</h1>
  <p id="intro">Type your reply in the box below. The quick brown fox jumps over the lazy dog.</p>
  <textarea id="reply"></textarea>
  <textarea id="note"></textarea>
  <input type="text" id="title">
  <input type="search" id="query">
  <input type="password" id="secret">
  <input type="email" id="mail">
  <!-- #826：登录页的“显示密码”按钮把同一个框的 type 在 password 与 text 之间切换，autocomplete 不变 -->
  <input type="password" id="login-pass" autocomplete="current-password">
  <button type="button" id="show-pass">Show password</button>
  <script>
    document.getElementById('show-pass').addEventListener('click', function () {
      var f = document.getElementById('login-pass');
      f.type = f.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
