<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>声明是外文、内容是中文的页面</title>
  <style>body { max-width: 760px; margin: 24px auto; font: 16px/1.5 sans-serif; }</style>
</head>
<body>
  <!-- #843（规格 #831）：#777 当时说的反方向 —— 不少中文站点把声明写成 en。
       内容识别看到的是中文，闸门应当拦下，一个请求都不发。 -->
  <main id="content">
    <h1 id="title">春季新品发布会邀请函</h1>
    <p id="p1">诚挚邀请您参加我们的春季新品发布会，届时将展示全新的产品线与设计理念。</p>
    <p id="p2">发布会将于下周六下午两点在市中心会展中心举行，现场备有茶点，欢迎携友人一同前来。</p>
    <p id="p3">如需报名，请在本周五之前回复本邀请函，我们会为您预留座位并寄送入场凭证。</p>
  </main>
</body>
</html>
