<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Iframe Test</title></head>
<body>
  <h1>Main Document</h1>
  <p>This paragraph is in the main document and should be translated.</p>
  <iframe id="frame1" src="about:blank" style="width:100%;height:150px"></iframe>
  <script>
    const iframe = document.getElementById('frame1');
    iframe.onload = () => {
      const doc = iframe.contentDocument;
      doc.open();
      doc.write('<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><p>Iframe content that may or may not be translated depending on configuration.</p></body></html>');
      doc.close();
    };
  </script>
</body>
</html>
